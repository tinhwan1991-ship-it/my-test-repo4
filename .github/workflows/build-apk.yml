
name: Build SNOWBOUND Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q snowbound-android-project.zip -d extracted-project
          test -f extracted-project/snowbound-android/app/build.gradle
          test -f extracted-project/snowbound-android/gradlew

      - name: Build debug APK
        working-directory: extracted-project/snowbound-android
        run: bash gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snowbound-debug-apk
          path: extracted-project/snowbound-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
